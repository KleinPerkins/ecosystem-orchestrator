name: verify

# Minimal CI for KleinPerkins/ecosystem-orchestrator. Added 2026-06-26 to give the orchestrator
# remote enforcement for the first time — until now, regressions in vendor.sh / consistency.sh
# were caught only by LD running the dev-repo regression suite locally. Two gates:
#   - shellcheck on bin/*.sh + lib/*.sh (catches a wide class of bash bugs cheaply)
#   - a hermetic smoke that sources payload.sh + invokes its generators against a tmpdir master
#     fixture, asserting the descriptor + cpp meta render is well-formed. This protects the new
#     Phase-3 byte-compare contract (consistency.sh's regen-and-cmp depends on payload.sh
#     producing identical output to vendor.sh's tarred payload).
#
# Proportional to a solo repo — bash + shellcheck only; no Python, no MCP, no secrets.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: shellcheck bin + lib
        # Severity gate: -S error catches real bugs (syntax errors, undefined uses, broken
        # quoting that changes behavior). Pre-existing info/warning findings (SC2015 A&&B||C
        # patterns; the SC2046 in selfmanage.sh) are deferred to a tech-debt follow-up — the
        # CI's job here is to prevent NEW regressions, not retroactively lint clean every
        # legacy line. SC1091 ("Not following: <file>") stays excluded because sourced files
        # resolve at runtime via common.sh.
        run: shellcheck -e SC1091 -S error bin/*.sh lib/*.sh

  payload-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: payload.sh generators (mcp descriptor + cpp meta)
        run: |
          set -euo pipefail
          # Hermetic fixture: a minimal kind:mcp master. Use printf (NOT heredoc) — under a YAML
          # literal block scalar, leading indentation is preserved, and bash heredoc terminators
          # only match at column 0, so a `<<EOF` here silently swallows the rest of the script.
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/master" "$tmp/dst" "$tmp/dst2"
          printf '%s\n' \
            'schema: kp-capability/v1' \
            'id: smoke-kit' \
            'kind: mcp' \
            'flavor: 1' \
            'scope: global' \
            'owner: KleinPerkins' \
            'install: install.sh' \
            'post_mgmt: none' > "$tmp/master/meta.yml"
          . lib/payload.sh
          payload_emit_mcp_descriptor "$tmp/dst" smoke-kit
          payload_emit_vendored_md    "$tmp/dst" smoke-kit
          payload_emit_cpp_meta       "$tmp/dst" smoke-kit "$tmp/master" ""
          for f in README.md VENDORED.md meta.yml; do
            [ -f "$tmp/dst/$f" ] || { echo "FAIL: $f not generated"; exit 1; }
          done
          # Zero-link: no ld tokens in the descriptor.
          re='KleinPerkins/[A-Za-z0-9_.-]+|kp-mcp|ecosystem-orchestrator|/Users/laurence\.duggan|/dev/capabilities'
          hits="$(grep -REnI "$re" "$tmp/dst" || true)"
          if [ -n "$hits" ]; then
            echo "FAIL: ld tokens leaked into the cpp descriptor:"; printf '%s\n' "$hits" | sed 's/^/  /'
            exit 1
          fi
          # Idempotent: a second run produces byte-identical output.
          payload_emit_mcp_descriptor "$tmp/dst2" smoke-kit
          payload_emit_vendored_md    "$tmp/dst2" smoke-kit
          payload_emit_cpp_meta       "$tmp/dst2" smoke-kit "$tmp/master" "$(cat "$tmp/dst/meta.yml")"
          diff -q "$tmp/dst/README.md"   "$tmp/dst2/README.md"
          diff -q "$tmp/dst/VENDORED.md" "$tmp/dst2/VENDORED.md"
          diff -q "$tmp/dst/meta.yml"    "$tmp/dst2/meta.yml"
          echo "payload-smoke: OK"

  lockkit-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lockkit fixture matrix
        run: bash tests/test_lockkit.sh
