schema: eco-registry/v1
# config/registry.yml — the SOLE enrollment SoT for global capabilities (B1a; replaces the retired
# config/managed-items.txt). The orchestrator reads this to decide what to vendor into cpp/quiver and
# to run the enrollment-drift check; `bin/orchestrator.sh enroll|exclude|demote|status` mutate it.
#
# Each record is intentionally minimal. While a capability's master exists, its kind/flavor/scope/
# expose are read LIVE from meta.yml; the OPTIONAL pinned kind/cpp_category a record may carry are a
# delete-after-master-gone fallback only (so a stranded cpp payload can still be located + removed).
#
#   state: enrolled  -> vendored to cpp on `orchestrator cpp-sync`
#          excluded  -> intentionally NOT vendored (drift check treats as an expected omission)
#          demoted   -> was scope:global, now local-only; delete-propagated out of cpp
#   reason: freeform; document WHY for excluded/demoted (and any non-obvious enrollment)
#
# Readers ignore unknown keys (forward-compatible, P0-3). Journal fields are optional machine-edited
# cache/state, never enrollment authority:
#   content_digest: current shared-content digest last observed by approve/status/repair
#   approved_digest: digest approved for flavor-2 supply-chain sync
#   last_synced_cpp_sha / last_synced_at: observed cpp main commit containing the payload + UTC refresh
# Malformed journal fields are warnings in status and treated as absent by gates. They are intentionally
# excluded from .eco-registry.lock parity. orch_schema_assert gates the schema major. The `items:` list
# below is machine-edited by enroll/exclude/demote/approve/repair/quarantine, so keep it free of
# interleaved comments (one record per id).
#
# Excluded set context: agent-route is a machine-local workspace router (not meaningful as a cpp
# copy). The Anthropic flavor-2 snapshots (anthropics/skills@35414756) have landed under
# source_skills_global but enrolling+vendoring each to cpp is a later governed orchestrator PR; they
# are excluded until then so the drift check treats them as expected omissions.
