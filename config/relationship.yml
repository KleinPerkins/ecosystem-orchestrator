# config/relationship.yml — THE ld<->cpp relationship (INV-zero-link: defined ONLY here).
# Flat keys (dependency-free parsing). Read by bin/orchestrator.sh.
schema: orchestrator-relationship/v1

# --- Upstream (ld) global masters: sources of vendorable capabilities ---
source_skills_local: ~/dev/capabilities/skills
source_skills_global: ~/dev/capabilities/skills/global
# Active URLs remain unchanged before the separately released name transaction.
# Retained endpoints are aliases only for these immutable original repository IDs.
source_skills_repo: git@github.com:KleinPerkins/skills.git
source_skills_repo_id: 1275604090
source_skills_retained_repo: git@github.com:KleinPerkins/skills-private-original.git
source_mcp_local: ~/dev/capabilities/mcp
source_mcp_repo: git@github.com:KleinPerkins/kp-mcp.git
source_mcp_repo_id: 1271164179
source_mcp_retained_repo: git@github.com:KleinPerkins/kp-mcp-private-original.git

# --- Downstream consumer (cpp), the governed target ---
cpp_repo: Affirm/card-platform-product
cpp_clone_url: git@github.com:Affirm/card-platform-product.git
cpp_default_branch: main
cpp_quiver_path: quiver
cpp_pr_branch_prefix: orchestrator/vendor
# Governance (Decision B): LD-authored, quiver-only PR landed via GitHub NATIVE auto-merge
# (`gh pr merge --auto --squash`). cpp's OWN required server checks + the @affirm-cpp-bot CODEOWNER
# auto-approval gate the merge — NO human reviewer and NO admin bypass on the routine path. `--admin`
# (bypass) is BREAK-GLASS ONLY (vendor.sh --break-glass-admin / ORCH_VENDOR_BREAKGLASS_ADMIN=1).
# Documentation-of-record; the ENFORCED behavior lives in lib/vendor.sh.
cpp_merge_mode: auto-squash
# NEVER write these cpp paths (control plane):
cpp_forbidden_paths: _ops/ .github/

# --- WF2 cpp-sync ---
# enabled_kinds: the cpp-VENDORABLE kinds. cpp-sync REFUSES any enrolled id whose meta.yml kind is not
# in this list. Phase-2 routing kinds were enabled after cpp PR #170 merged green. Space-separated.
enabled_kinds: skill mcp rule sub-agent tool
# cpp_sync_denylist: fixed orchestrator-owned cpp ids that delete-propagation must NEVER auto-remove
# (the data-plane manifest tooling item lives here, B5). Manifest `owned_ids` additionally derives
# active ids and bounded historical removal tombstones; this list is only the fixed tooling floor.
# Space-separated.
cpp_sync_denylist: eco-capability-sync

# --- Downstream personal consumer (chaos-labs), shim-sync only ---
# This target is deliberately NOT cpp's full package model. The orchestrator can write a tiny
# google-kit pointer/env shim here on explicit `orchestrator chaos-shim-sync --execute`; this config
# carries no personal doc-style profile bytes.
chaos_labs_root: ~/dev/personal/chaos-labs
chaos_labs_shim_path: scripts/setup/google-kit-shim.sh
chaos_labs_env_path: config/google-kit.env.example

# --- LD's local cpp working tree (Decision A: symlink-dedup ABANDONED; consistency-check target) ---
# Symlink-dedup is retired — unsafe (routine cpp git ops write THROUGH the link into the global SOT)
# and semantically wrong (master != vendored payload). cpp keeps the REAL vendored copy; integrity is
# enforced by `orchestrator consistency` (lib/consistency.sh), NOT by collapsing the copies.
ld_cpp_worktree: ~/dev/affirm/src/card-platform-product

# --- Work area (out-of-tree clone; gitignored) ---
work_clone_dir: ~/.orchestrator-work/cpp-clone
backup_dir: ~/.reorg-archives
